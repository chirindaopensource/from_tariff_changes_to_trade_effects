      - "fabricated metals (-3.74)"
      - "motor vehicles (-3.03)"
      - "wood (-5.91)"
    decimals:  # [S]
      margin: 3
      sigma: 2
      percent: 2
    guard_not_a_decomposition: "Table 1 is NOT an explicit decomposition of eq. (19)"  # [S]
  table2:
    gains_def: "sum of TradeEffect_ik over TradeEffect_ik > 0"  # [S]
    losses_def: "sum of TradeEffect_ik over TradeEffect_ik < 0"  # [S]
    net_formula: "Gains + Losses"  # [S]
    split: ["international", "domestic"]  # [S]
    units: "millions of US dollars"  # [S]
    rounding_tolerance: 1  # [I]
