# --------------------------------------------------------------------------
# 15. REPLICATOR'S IMPUTATION REGISTER (pre-declared; all [X])
# --------------------------------------------------------------------------
replicator_imputation_register:
  G1_alpha_rule:
    # [X] EXACT CES inversion; the prior config's "expenditure shares" is a misspecification
    # corrected here
    primary: "alpha_i is proportional to s_ik * (1 + tau_ik)^(sigma_k - 1), normalised to sum to 1"
    rationale: "the only rule that reproduces observed shares identically after inversion; verified analytically and numerically"
    alternatives: ["uniform (1/|V_k|)", "import shares, foreign only"]
    acceptance_test: "predicted shares equal observed shares to 1e-12 for every (i, k)"
  G2_beta_k:
    primary: "sigma_bar_k - 1 (derived from Table 1, col. 2)"  # [X]
    rationale: "the CES/Armington reading under a tariff-factor regressor; the map beta = sigma - 1 is the natural one; alternatives sigma = beta (which is admissibility-equivalent only if the regressor is a factor-ratio)"
    alternatives: ["re-estimate by Design B", "sigma = beta"]
    note: "the paper never prints beta_hat; only sigma_bar_k appears in Table 1 col. 2; the derivation is a calibration, not an identification"
  G3_beta_to_sigma_map:
    # [X] REMOVED the "sigma = 1 - beta" candidate per item E3 of the prior evaluation (violates
    # sigma > 1)
    candidates: ["sigma = beta + 1", "sigma = beta"]
    # [UNSPECIFIED IN MANUSCRIPT] label as calibration, not identification; the selection is
    # disclosed
    selection: "choose map reproducing Table 1 col. 2 to 2 dp"
  G4_significance_threshold:
    primary: 0.05  # [UNSPECIFIED IN MANUSCRIPT]
    grid: [0.01, 0.05, 0.1]  # [X]
  G5_baseline_year_and_window:
    # [UNSPECIFIED IN MANUSCRIPT] last pre-2018 wave year; alternatives 2021 and the 2016-2021
    # mean
    baseline_year_for_margins: 2017
    # [S] the two decisions are distinct; the paper uses the full window for estimation and does
    # not state a baseline year for the margins
    estimation_window: [2016, 2021]
    alternatives_baseline_year: [2021, "2016-2021 mean"]  # [X]
  G6_product_level:
    primary: "HS6"  # [UNSPECIFIED IN MANUSCRIPT]
    alternatives: ["HS8", "HS10"]
    test: "verify tariff varies across i within k at the chosen level; if it does not, a coarser level is required"
    open_question: "at what level is V_k defined, and hence the CES benchmark computed — HS6, or ISIC 2-digit? The two give different network topologies and different margins; the choice must be declared"
  G7_ave_convention:
    primary: "WITS-supplied AVEs where available"
    fallback: "unit-value basis, with source recorded"
    # [UNSPECIFIED IN MANUSCRIPT] 100 percent cap so (1+tau) is finite inside the power mean
    prohibitive_ceiling: 1.0
    record: "affected cells and trade share"
  G8_repulsion_term:
    primary: "iterative symmetric displacement below declared threshold"
    max_displacement: 0.15  # [UNSPECIFIED IN MANUSCRIPT]
    n_sweeps: 50  # [UNSPECIFIED IN MANUSCRIPT]
    # [UNSPECIFIED IN MANUSCRIPT] tau = 1 is unattainable for a 2D embedding of a non-metric Gower
    # space
    invariant: "Kendall tau >= 0.95 over all pairs, with Spearman rho reported"
  G9_selected_partners_set_P:
    # [UNSPECIFIED IN MANUSCRIPT] see scenario_construction; China, India, and Vietnam excluded so
    # that amplification reproduces the positive results
    primary: ["MEX", "CAN", "JPN", "DEU", "KOR", "GBR", "FRA", "ITA", "BRA", "IRQ", "CHE", "SAU"]
    test: "must reproduce China +17.0 percent, India +25.6 percent"
    note: "the prior config placed China IN S and thereby contradicted its own test; corrected (item E2)"
  G10_rule_precedence:
    candidates: ["additive", "max"]  # [UNSPECIFIED IN MANUSCRIPT]
    primary: "max"  # conservative
    report: "both; note which matches Table 2 magnitudes"
  G11_clustering_dimension:
    primary: ["exporter", "product_time"]  # [UNSPECIFIED IN MANUSCRIPT]
    alternatives: ["product_time only", "exporter only"]  # [X]
  G12_conserving_reallocation:
    # [X] the paper's Table 2 does NOT satisfy this; the residual must be reported as a finding of
    # the reproduction, not suppressed
    primary: "impose sum_i TradeEffect_ik = 0 within V_k"
    residual_reporting: "report against excluded cells; the paper's printed sum is approximately -155.8 bn"

# --------------------------------------------------------------------------
# 16. INTEGRITY, AUDIT, AND ACCEPTANCE TESTS
# --------------------------------------------------------------------------
integrity_and_audit:
  algebraic_tests:
    T1_gower_self:
      identity: "D_ss = 0 for all s"
      tol: "exact"
    T2_gower_symmetry:
      identity: "D_ss' = D_s's for all s,s'"
      tol: "exact"
    T3_gower_grid:
      identity: "18 * D_ss' in Z"
      tol: "exact"
    T4_weight_conservation:
      identity: "sum_i omega_ik = 1"
      tol: 1.0e-12
    T5_ces_limit_inf:
      identity: "sigma -> inf: 1+T_k -> min_i (1+tau_i)"
      tol: 1.0e-06
    T6_ces_limit_one:
      identity: "sigma -> 1: 1+T_k -> prod_i (1+tau_i)^alpha_i"
      tol: 1.0e-06
    T7_margin_definition:
      identity: "btm_ik recomputed from 1+T_k"
      tol: 1.0e-15
    T8_attribution:
      identity: "-Delta_ln(1+tau) + Delta_ln(1+T) = Delta_ln btm"
      tol: 1.0e-15
    T9_multiplicative_factorisation:
      identity: "own_factor * bench_factor = btm_CF / btm_0"
      tol: 1.0e-14
    T10_jacobian_zero_row_sum:
      identity: "sum_j d ln M_i / d ln(1+tau_j) = 0 over V_k"
      tol: 1.0e-12
    T11_uniform_foreign_shock:
      identity: "all foreign margins fall by a common factor; domestic unchanged"
      tol: 1.0e-12
    T12_conserving_reallocation:
      identity: "sum_i TradeEffect_ik = 0 over V_k"
      tol: 1.0e-10
    T13_alpha_self_consistency:
      identity: "predicted shares equal observed shares"
      tol: 1.0e-12
    T14_fixed_point_map:
      identity: "||F(sigma) - sigma|| < tol AND spectral_radius < 1"
      tol: 1.0e-10
    T15_domestic_own_factor_unity:
      identity: "own_multiplier for DOM = 1.0"
      tol: 1.0e-15
    T16_table1_arithmetic:
      identity: "DeltaBTM = (SIM/CES - 1) * 100"
      tol: 0.01
  sign_pattern_tests:
    table1_industry_margins:  # [S]
      positive: 13
      negative: 4
    table2_domestic_nonzero_industries: 8  # [S]
    table3_positives: ["China", "India", "Vietnam"]  # [S]
    table3_large_negatives: ["Japan", "Mexico", "Germany"]  # [S]
  calibration_hazard_reconciliations:
    industry: "Medical, precision and optical instruments"  # [S]
    delta_btm_percent: 7.88  # [S]
    sigma: 64.33  # [S]
    implied_multiplier_if_identity: 63.33  # [I]
    implied_delta_ln_M: 4.8033  # [I] = 63.33 * ln(1.0788)
    # [I] exp(4.8033) - 1 ~ 121.02, times 100; the earlier config's 12150 was a rounding
    implied_percent_expansion: 12102.0
    reconciliations_to_test:
      - "industry-mean sigma masks per-product variation"  # [X]
      - "the beta-to-sigma map is not the identity (i.e., sigma = beta is correct, not sigma = beta + 1)"  # [X]
      - "Table 2 aggregation is over product-level effects with offsetting signs within the industry"  # [X]
    verdict_test: "which of the three reconciles the +647 foreign net with the +7.88 percent margin"
  three_sequential_calibration_targets:
    - "sigma_bar_k vector (Table 1 col. 2) — isolates the elasticity pipeline"
    - "BTM levels (Table 1 cols. 3-4, 3 dp) — isolates alpha construction and baseline year"
    - "dollar effects (Tables 2-3) — isolates beta_hat, S membership, sectoral codes, precedence"
  sensitivity_grid_axes:
    - "alpha rule (G1)"
    - "baseline year (G5)"
    - "beta-to-sigma map (G3)"
    - "filter threshold (G4)"
    - "rule precedence (G10)"
    - "estimation route (Design A vs B)"
    - "S membership (G9)"
    - "product level (G6)"
  deliverables_absent_from_paper:
    - "beta_hat_k with SEs and p-values"
    - "Delta_ln(1+T_k) by product and industry"
    - "alpha_i construction and values"
    - "the beta-to-sigma map with selecting derivation"
    - "filter counts and excluded trade share"
    - "P3 convergence diagnostics"
    - "per-table sample composition"
    - "full sensitivity grid"
    - "the algebraic tests T1-T16"
    - "resolution of three missing citations and the Dang date"
    - "attribution table with own and benchmark components as separate columns"
    - "conserving reallocation and its residual"

