    columns:
      isic_2digit: "string"  # [S]
      industry_label: "string"  # [S]
      sigma_mean_reported: "float64"  # [S]
      beta_k_derived: "float64"  # [X]
      beta_se: "float64"  # [G]
      beta_pval: "float64"  # [G]
      n_products_in_industry: "int16"  # [G]
      excluded_by_sigma_eq_2: "int8"  # [S]

# --------------------------------------------------------------------------
# 3. PREPROCESSING
# --------------------------------------------------------------------------
preprocessing:
  industry_concordance: "ISIC Rev.3, two-digit"  # [S]
  # [UNSPECIFIED IN MANUSCRIPT] a guess, chosen because HS2017 spans the 2017-2021 bulk of the
  # panel and is modal in ITPDE snapshots over the window; alternatives HS2012 and HS2022 carried
  # as a sensitivity axis
  hs_revision: "HS2017"
  # [UNSPECIFIED IN MANUSCRIPT] primary = HS6, on granularity grounds; alternatives HS8 and HS10
  # carried; the choice changes |V_k| and therefore every omega_ik
  product_level: "HS6"
  product_level_principle: "most disaggregated level at which tariff treatment differs across exporters and products"  # [S]
  record_unmapped_codes: true  # [X]
  record_multi_industry_allocation: true  # [X]
  # [UNSPECIFIED IN MANUSCRIPT] a guess, chosen as the last pre-2018 wave year in the panel;
  # alternatives 2021 and the 2016-2021 arithmetic mean
  baseline_year_for_margins: 2017
  estimation_window: [2016, 2021]  # [S]
  # [UNSPECIFIED IN MANUSCRIPT] default drops the cell from V_k rather than imputing MFN, on the
  # grounds that the MFN rate may not reflect any scheme for which the supplier is eligible;
  # alternative = impute MFN, carried as a sensitivity axis; the affected trade share must be
  # reported under all choices
  missing_tariff_rule: "drop_supplier_from_V_k"
  # [UNSPECIFIED IN MANUSCRIPT] the broadcast semantics for WLD / EUN / ROW / ALL as erga omnes
  # proxies; the group code is stripped from V_k after broadcast
  group_code_broadcast_rule: "apply_to_partners_without_partner_specific_MFN"
  # [UNSPECIFIED IN MANUSCRIPT] WITS-supplied AVE primary; unit-value basis fallback; the affected
  # share is reported
  ave_convention: "WITS_AVE_where_available"
  # [UNSPECIFIED IN MANUSCRIPT] cap the ad valorem rate at 100 percent so (1+tau) remains finite
  # inside the power mean; alternative = drop the cell from V_k, with the affected trade share
  # reported
  prohibitive_duty_ceiling: 1.0
  # [UNSPECIFIED IN MANUSCRIPT] declaration of the TRQ convention; the alternative, dropping TRQ
  # cells, is carried as a sensitivity axis
  quota_handling: "in_quota_rate_retained"
  applied_vs_statutory_distinction: "applied_protection"  # [S]
  trade_weighted_average_warning: true  # [S]
  distinguish_nan_from_zero: true  # [I]

# --------------------------------------------------------------------------
# 4. SAMPLE CONSTRUCTION
# --------------------------------------------------------------------------
sample_construction:
  filter_rule: "beta_hat_k > 0 AND significant"  # [S]
  # [UNSPECIFIED IN MANUSCRIPT] conventional 5 percent level, on standard inference grounds; grid
  # {0.01, 0.05, 0.10} carried
  filter_significance_threshold: 0.05
  filter_direction_of_bias: "raises the reported mean elasticity"  # [I]
  filter_population_effect: "redefines the sample for every subsequent average and sum"  # [I]
  excluded_industries_rule: "sigma_k = 2"  # [S]
  industries_remaining_after_filter: 17  # [S]
  excluded_trade_share_reported: true  # [X] resolves H10 of the prior register
  # [X] quartiles, min, max of beta_hat_k before the filter
  pre_filter_distribution_reported: true

# --------------------------------------------------------------------------
# 5. TARIFF CONSTRUCTION
# --------------------------------------------------------------------------
tariff_construction:
  rate_representation_for_differencing: "tariff rate tau"  # [I]
  factor_representation_for_ratios: "tariff factor (1 + tau)"  # [S]/[I]
  # [UNSPECIFIED IN MANUSCRIPT] uses WITS-TRAINS tariff_type=APPLIED where recorded, on the
  # grounds that APPLIED already embeds preferential utilisation; fallback
  # "min_eligible_pref_or_MFN"; contrast with the paper's implicit "PREF if claimed, else MFN"
  # which is undefined on the word "claimed"
  baseline_construction_rule: "APPLIED_direct"
  # [UNSPECIFIED IN MANUSCRIPT] avoid double-imputing utilisation on already-applied rates
  preference_utilisation_rule: "embedded_in_APPLIED"
  # [I] a 10 pp increment is NOT a uniform shock in log space
  ten_pp_log_shift: "Delta_ln(1+tau) varies 0.0408-0.0953 across base rates"
  scenario_decimals_vs_factors: "increment added to tau, not to (1+tau)"  # [S]

# --------------------------------------------------------------------------
# 6. NODE AUGMENTATION AND THE COMPETITIVE NETWORK N2
# --------------------------------------------------------------------------
node_augmentation:
  V_k_construction: "{ i : M_ikt > 0 } union { 'DOM' }"  # [I]
  domestic_tariff_rate: 0.0  # [I]
  domestic_included_in_benchmark: true  # [S]
  domestic_tariff_invariant_across_states: true  # [I]
  filter_aggregate_partner_codes: ["WLD", "EUN", "ROW", "ALL"]  # [X]
  vegan_endogeneity_recording: "report |V_k| and its trade share, and how |V_k| varies with the applied MFN rate"  # [X]
  domestic_nonzero_assertion: "the domestic node must respond in every market where any foreign margin moves; industries reporting identically zero domestic effects in Table 2 (8 of 17) require explanation"  # [I]

# --------------------------------------------------------------------------
# 7. SCENARIO CONSTRUCTION (decomposition of the Feb-2026 counterfactual)
# --------------------------------------------------------------------------
scenario_construction:
  increment_selected_partners: 0.1  # [S]
  increment_bolivia: 0.15  # [S]
  increment_steel_aluminium: 0.25  # [S]
  increment_motor_vehicles_parts: 0.25  # [S]
  increment_copper: 0.5  # [S]
  sectoral_buckets: ["steel and aluminium", "motor vehicles and parts", "copper"]  # [S]
  sectoral_scope: "across exporters"  # [S]
  partner_increment_scope: "partner-selective"  # [S]
  rate_basis: "additional"  # [S]
  sectoral_hs_code_lists:
    # [UNSPECIFIED IN MANUSCRIPT] a plausible mapping on standard Sec. 232 product scope grounds;
    # alternatives at HS4 and HS8 carried
    steel_and_aluminium:
      HS4_range: ["7208", "7229"]
      HS4_add: ["7601", "7604", "7606", "7608"]
      rule: "HS6 under these HS4 heads"
    motor_vehicles_parts:  # [UNSPECIFIED IN MANUSCRIPT] as above
      HS4_range: ["8701", "8705"]
      HS4_add: ["8708"]
      rule: "HS6 under these HS4 heads"
    copper:  # [UNSPECIFIED IN MANUSCRIPT] as above
      HS4_range: ["7401", "7419"]
      HS4_add: []
      rule: "HS6 under these HS4 heads"
  selected_partners_set_P:
    # [UNSPECIFIED IN MANUSCRIPT] enumerated on the reasoning that the Table 3 large-negative
    # exporters (MEX, CAN, JPN, DEU, KOR, GBR, FRA, ITA) receive direct 10 pp increments, while
    # the positive responders (CHN +17.0, IND +25.6, VNM +1.4) sit OUTSIDE the set and gain via
    # amplification; Bolivia is treated separately at 15 pp per the paper's own text
    primary: ["MEX", "CAN", "JPN", "DEU", "KOR", "GBR", "FRA", "ITA", "BRA", "IRQ", "CHE", "SAU"]
    alternatives: ["all_major_partners_except_China_india", "explicit_tracker_coverage_lines"]
    # [X] the amplification-gainers; China MUST be outside S for the China +17.0 percent Table 3
    # test to be achievable
    excluded_by_primary: ["CHN", "IND", "VNM"]
    rationale: "reconciles the China +17.0 and India +25.6 results with the amplification mechanism; the prior evaluation flagged the original config placing China inside S as contradicting its own test (item E2)"
  # [UNSPECIFIED IN MANUSCRIPT] maximum is conservative (a supplier eligible under both a partner
  # 10 pp and a product 25 pp rule receives 25 pp, not 35 pp); alternative "additive" carried as a
  # sensitivity axis
  rule_precedence: "maximum"
  # [UNSPECIFIED IN MANUSCRIPT] cap at the largest declared increment (copper); alternatives
  # "none" and 0.35 carried
  admissibility_ceiling: 0.5
  domestic_node_increment: 0.0  # [I]

# --------------------------------------------------------------------------
# 8. EQUATION PARAMETERS
# --------------------------------------------------------------------------
equation_parameters:
  eq01_02_tariff_change:
    time_index_convention: ["0", "1"]  # [S]
    null_case_mechanism: "MFN increase with preferential rate unchanged"  # [S]
    insufficiency_claim: "d tau_ik does not characterise the change in market access"  # [S]
  eq03_ces_reference:
    alpha_symbol: "alpha_i"  # [S]
    alpha_normalisation: 1.0  # [S]
    alpha_lower_bound: 0.0  # [I]
    # [X] EXACT CES inversion: alpha_i / alpha_j = s_ik(1+tau_ik)^(sigma_k-1) /
    # s_jk(1+tau_jk)^(sigma_k-1); verified in the prior evaluation (item E1) as the only rule that
    # reproduces observed shares identically
    alpha_construction_rule: "alpha_i is proportional to s_ik * (1 + tau_ik)^(sigma_k - 1)"
    # [X] residual |s_hat_ik - s_ik| < 1e-12 for all (i, k)
    alpha_self_consistency_test: true
    sigma_symbol: "sigma_k"  # [S]
    sigma_lower_bound_exclusive: 1.0  # [S]
    aggregator_exponent: "1 / (1 - sigma_k)"  # [I]
    inner_exponent: "1 - sigma_k"  # [I]
    limit_sigma_to_infinity: "min_i (1 + tau_ik)"  # [I]
    limit_sigma_to_one: "Product_i (1 + tau_ik)^alpha_i"  # [I]
    limit_verification_sigma_inf: 1000.0  # [X]
    limit_verification_sigma_one: 1.0001  # [X]
    limit_verification_tolerance: 1.0e-06  # [I]
    sigma_industry_means_table1:
      ISIC_11_Extraction_crude_petroleum: 22.78  # [S]
      ISIC_15_Food_products: 41.9  # [S]
      ISIC_17_Textiles: 13.23  # [S]
      ISIC_19_Leather_luggage_footwear: 5.63  # [S]
      ISIC_20_Wood_and_cork: 4.09  # [S]
      ISIC_23_Coke_refined_petroleum: 2.78  # [S]
      ISIC_24_Chemicals: 57.86  # [S]
      ISIC_25_Rubber_and_plastics: 46.64  # [S]
      ISIC_26_Other_non_metallic_mineral: 7.23  # [S]
      ISIC_28_Fabricated_metal: 30.49  # [S]
      ISIC_29_Machinery_equipment_nec: 11.99  # [S]
      ISIC_31_Electrical_machinery: 4.91  # [S]
      ISIC_32_Radio_TV_communication: 41.26  # [S]
      ISIC_33_Medical_precision_optical: 64.33  # [S]
      ISIC_34_Motor_vehicles_trailers: 17.18  # [S]
      ISIC_35_Other_transport_equipment: 16.65  # [S]
      ISIC_36_Furniture_manufacturing_nec: 10.03  # [S]
    sigma_excluded_conventional_value: 2.0  # [S]
    n_industries_reported: 17  # [S]
  eq04_margin:
    numerator: "(1 + T_k)"  # [I]
    denominator: "(1 + tau_ik)"  # [I]
    unit_of_measure: "dimensionless ratio, centred at unity"  # [I]
    identity_condition: "btm = 1 iff tau_ik = T_k"  # [I]
    interpretation_above_one: "relatively favourable treatment"  # [S]
    interpretation_below_one: "relative disadvantage"  # [S]
    observed_range_table1: [0.924, 1.095]  # [S]
  eq05_non_equivalence:
    relation_type: "non-implication"  # [S]
    premise: "d tau_ik = 0"  # [S]
    conclusion_denied: "d btm_ik = 0"  # [S]
    beneficiaries_under_protection: "preferential exporters"  # [S]
    losers_under_liberalization: "preferential exporters"  # [S]
  eq06_13_two_experiments:
    exporter_A_role: "preferential supplier; own tariff unchanged in both"  # [S]
    exporter_B_role: "non-preferential supplier; own tariff is the shock"  # [S]
    experiment_L_perturbation: "tau_B^1 < tau_B^0, tau_A^1 = tau_A^0"  # [S]
    experiment_L_effect: "T_k^1 < T_k^0; btm_A^1 < btm_A^0"  # [S]
    experiment_P_perturbation: "tau_B^1 > tau_B^0, tau_A^1 = tau_A^0"  # [S]
    experiment_P_effect: "T_k^1 > T_k^0; btm_A^1 > btm_A^0"  # [S]
    ceteris_paribus_clause: "holding other elements of the benchmark constant"  # [S]
    named_mechanism_liberalization: "preference erosion"  # [S]
    named_mechanism_protection: "preference amplification"  # [S]
    direction_liberalization_chain: "tau_B down -> T_k down -> btm_A down"  # [S]
    direction_protection_chain: "tau_B_MFN up -> T_k up -> btm_A up"  # [S]
    bilateral_measure_blind_spot: "records no policy change for amplified-preference exporters"  # [S]
  eq14_estimation:
    estimator: "PPML"  # [S]
    dependent_variable: "M_ikt"  # [I]
    regressor: "ln(btm_ikt)"  # [S]
    coefficient_symbol: "beta_k"  # [S]
    fe_exporter_time: "gamma_it"  # [S]
    fe_product_time: "delta_kt"  # [S]
    fe_importer_time: null  # [I]
    fe_bilateral: null  # [I]
    zero_flows_retained: true  # [I]
    # [UNSPECIFIED IN MANUSCRIPT] preferred specification imposes the cross-equation restriction
    # H0: beta_bm_k = -beta_own_k; only this design tests the paper's claim that measurement and
    # estimation are jointly determined. Design_A (the paper's executed choice, saturated in
    # delta_kt) is carried as an alternative
    design_choice: "Design_B_over_identified"
    # [I] observationally equivalent under saturation
    design_A_model: "exp[ -beta_k ln(1+tau_ikt) + gamma_it + delta_kt ]"
    design_B_model: "exp[ beta_own_k ln(1+tau_ikt) + beta_bm_k ln(1+T_kt) + gamma_it + delta_k + delta_t + theta ln E_kt ]"  # [X]
    design_B_hypothesis: "H0: beta_bm_k = -beta_own_k (Wald, chi^2(1))"  # [X]
    identification_collinearity: "ln(1+T_kt) exactly collinear with delta_kt"  # [I]
    equivalent_restricted_model: "exp[ -beta_k ln(1+tau_ikt) + gamma_it + delta'_kt ]"  # [I]
    # [X] REMOVED "sigma = 1 - beta" per item E3 of the prior evaluation (violates sigma > 1 for
    # beta > 0)
    beta_to_sigma_map_candidates: ["sigma = beta + 1", "sigma = beta"]
    # [X] the CES/Armington reading for a tariff-factor regressor
    beta_to_sigma_map_primary: "sigma = beta + 1"
    pe_disclaimer: "single-importer truncation is not a full structural-gravity model"  # [S]
    resistance_absorption: "P_kt and E_kt absorbed by delta_kt; Pi_ikt and Y_ikt partly absorbed by gamma_it"  # [I]
    resistance_failure_at_counterfactual: "absorption valid for estimation; fails under counterfactual because absorbed terms are functions of the policy"  # [I]
  eq15_18_counterfactual_margin:
    state_set_eq15: [0, 1]  # [S]
    state_set_eq18: [0, "CF"]  # [S]
    recompute_benchmark_from_complete_schedule: true  # [S]
    bilateral_only_counterfactual_prohibited: true  # [S]
    third_state_labelling_table1: ["BTM_CES", "BTM_SIM"]  # [S]
  eq19_decomposition:
    decomposition_exactness: "EXACT"  # [I]
    own_tariff_component: "-Delta ln(1 + tau_ikt)"  # [S]
    benchmark_component: "Delta ln(1 + T_kt)"  # [S]
    domestic_own_component_identically_zero: true  # [I]
    benchmark_component_never_reported: true  # [G] flagged as never published in the paper
    cross_reference_in_table1_notes: "Equation (19)"  # [S]
    spillover_weight: "omega_ik = alpha_i (1+tau_ik)^(1-sigma_k) / (1+T_k)^(1-sigma_k)"  # [I]
    spillover_weight_conservation: "sum_i omega_ik = 1"  # [I]
    sign_own: "d ln btm_ik / d ln(1+tau_ik) = omega_ik - 1 <= 0"  # [I]
    sign_cross: "d ln btm_ik / d ln(1+tau_jk) = omega_jk >= 0"  # [I]
    uniform_shock_invariance: "all foreign margins fall by a common factor when a uniform foreign shock is applied; domestic unchanged"  # [I]
    multiplicative_factorisation: "1 + DeltaTrade = [(1+tau^0)/(1+tau^CF)]^beta * [(1+T^CF)/(1+T^0)]^beta"  # [I] NOT additive in dollars
    # [X] resolves the "attribution never tabulated" gap
    own_share_reported: true
    benchmark_share_reported: true  # [X]
  eq16_proportional_response:
    closed_form: "(btm_CF / btm_0)^beta_hat - 1"  # [I]
    fixed_effects_held_fixed: ["gamma_it", "delta_kt"]  # [I]
    verification_tolerance: 1.0e-10  # [X]
  eq17_valuation:
    scaler: "M^0_ik"  # [S]
    units: "millions of US dollars"  # [S]
    closed_form_full: "M^0_ik * [ own_factor * benchmark_factor - 1 ]"  # [I]
    own_multiplier: "[(1+tau^0_ik)/(1+tau^CF_ik)]^beta_hat_k"  # [I]
    benchmark_multiplier: "[(1+T^CF_k)/(1+T^0_k)]^beta_hat_k"  # [I]
    multipliers_structurally_identical: true  # [I]
    domestic_own_multiplier: 1.0  # [I] pure benchmark
    # [UNSPECIFIED IN MANUSCRIPT] eq. (17) uses observed M^0; Table 3's note uses predicted
    # baseline. The two differ and Table 2 and Table 3 are not reconcilable to a common baseline
    # without this declaration. Alternatives "predicted" and "both" carried
    denominator_choice: "observed_baseline"
    # [X] adds the adding-up constraint sum_i TradeEffect_ik = 0 within V_k, per item O1 of the
    # prior evaluation
    conserving_reallocation_imposed: true
    # [X] the residual against excluded cells is reported; the conservation test on the paper's
    # Table 2 fails by roughly 155.8 bn USD
    residual_reported: true

# --------------------------------------------------------------------------
# 9. ALGORITHM PARAMETERS (procedures P1-P5, all unnumbered in the paper)
# --------------------------------------------------------------------------
algorithm_parameters:
  P1_literature_space:
    P1_corpus_size: 17  # [S]
    P1_element_count: 9  # [S]
    P1_coding_levels: [0.0, 0.5, 1.0]  # [S]
    P1_coding_input_restriction: "abstract only"  # [S]
    P1_excluded_elements:  # [S]
      - "tariff change as source of variation"
      - "product-level trade data"
      - "US as importing market"
    P1_gower_denominator: 9  # [S]
    # = 1/18 [I] 9 elements, 2 half-units each, 18 half-units total
    P1_gower_grid_resolution: 0.05555555555555555
    P1_distance_target_nearest: 0.11  # [S] = 2/18
    P1_distance_target_fugazza: 0.28  # [S] = 5/18
    P1_distance_target_others: 0.33  # [S] = 6/18
    P1_element_radius_R: 5.5  # [S]
    P1_element_polar_angles_deg:  # [S]
      E1: 90
      E2: 50
      E3: 10
      E4: 330
      E5: 290
      E6: 250
      E7: 210
      E8: 170
      E9: 130
    P1_barycentre_weights: "c_sj"  # [S]
    P1_repulsion_term:
      # [UNSPECIFIED IN MANUSCRIPT] the paper states only "a small repulsion term"; primary =
      # iterative symmetric displacement below a displacement threshold, with the threshold and
      # iteration count logged
      kernel: "iterative symmetric displacement"
      # [UNSPECIFIED IN MANUSCRIPT] roughly 2.7 percent of R; chosen so that legibility gains are
      # visible without deforming the ordering
      max_displacement: 0.15
      n_sweeps: 50  # [UNSPECIFIED IN MANUSCRIPT] a sweep cap
    # [UNSPECIFIED IN MANUSCRIPT] EXACT tau = 1 over 136 pairs is unattainable for a 2D embedding
    # of a non-Euclidean metric (item E6); 0.95 is the standard embedding-diagnostic threshold
    P1_order_preservation_test: "Kendall tau >= 0.95 with Spearman rho reported"
    # [UNSPECIFIED IN MANUSCRIPT] item O5 of the prior evaluation
    P1_zero_claim_node_rule: "place at centroid of circle, marked unclassifiable"
    # [UNSPECIFIED IN MANUSCRIPT] item O6 of the prior evaluation; a one-claim barycentre must lie
    # on the ray to its element at radius R
    P1_single_claim_ray_diagnostic: true
    P1_edge_rendering_rule: "solid = 1, dashed = 0.5"  # [S]
    P1_edges_rendered_in_source: 18  # [S]
    P1_edges_possible: 153  # [I]
    P1_merge_rule: "methodological papers with one design merged"  # [S]
    P1_merge_rule_contradicted_by_figure: true  # [S]
    P1_unresolved_citations: ["Hertel & Mix (2026)", "Nicita (2019)", "Wang & Hannan (2023)"]  # [G]
    P1_anomalous_citation: "Dang, Krishna & Zhao (2003 in refs, 2026 in figure)"  # [G]
    P1_unused_legend_categories: ["GE models (cyan)", "Elasticities (magenta)", "Market access (yellow)"]  # [S]
    P1_inter_coder_kappa_minimum: 0.8  # [X]
    P1_self_count_claim: "five at full strength vs maximum four elsewhere"  # [S]
    P1_self_count_contradiction: "figure renders 3 solid + 2 dashed"  # [S]
  P2_four_step_framework:
    steps:  # [S]
      - "define the policy experiment"
      - "select the benchmark"
      - "estimate the trade elasticity"
      - "counterfactual evaluation"
    compressed_schematic: "Tariff shock -> Market access -> Elasticity -> Trade effect"  # [S]
    benchmark_menu:  # [S]
      - "Delta tau_ik"
      - "preference margin vs MFN"
      - "competitor-based average"
      - "CES-consistent btm_ikt"
    benchmark_non_interchangeability: true  # [S]
    measurement_estimation_non_separability: true  # [S]
    early_aggregation_prohibited: true  # [S]
    definition_bias: "error from choice of reference tariff"  # [S]
    aggregation_bias: "error from collapsing heterogeneous supplier treatments"  # [S]
  P3_fixed_point:
    init_benchmark: "tau_MFN"  # [S]
    update_map_order: ["btm", "beta_hat", "sigma_hat", "T_CES", "btm"]  # [S]
    # [G] beta -> sigma map unspecified by the paper; see eq14 beta_to_sigma_map_primary
    update_map_form: null
    stopping_rule: "until convergence, subject to existence and stability"  # [S]
    # [UNSPECIFIED IN MANUSCRIPT] standard numerical tolerance; enough to pin the printed
    # 2-decimal sigma values and 3-decimal margins
    convergence_tolerance: 1.0e-08
    # [UNSPECIFIED IN MANUSCRIPT] generous cap for a contracting map; a divergence detector fires
    # on non-decreasing residuals over 50 consecutive iterations
    max_iterations: 500
    # [UNSPECIFIED IN MANUSCRIPT] sup-norm on the parameter vector; alternative Euclidean norm
    # carried
    norm_for_convergence: "max_k |sigma_k^(r+1) - sigma_k^(r)|"
    existence_check: "report coefficient map range at the fixed point"  # [UNSPECIFIED IN MANUSCRIPT]
    stability_check: "spectral radius rho of the numerical Jacobian of F; require rho < 1"  # [UNSPECIFIED IN MANUSCRIPT]
    # [UNSPECIFIED IN MANUSCRIPT] under eq. (14) Design A, the map is the identity and the loop
    # terminates on the first pass; under Design B, iteration has content
    documented_as_executed: "single_pass_under_Design_A"
    structural_finding: "under Design A, d beta_hat / d sigma = 0; every sigma is a fixed point; convergence is vacuous"  # [I]
  P4_counterfactual:
    permitted_closures: ["partial equilibrium", "general equilibrium"]  # [S]
    closure_axes: ["expenditures", "output", "factory-gate prices", "multilateral resistance"]  # [S]
    pe_ge_non_interchangeability: true  # [S]
    recompute_benchmark_first: true  # [S]
  P5_empirical_pipeline:
    data_sources: ["ITPDE (bilateral + domestic)", "WITS-TRAINS (applied + MFN)"]  # [S]
    panel_window: [2016, 2021]  # [S]
    scenario_source: "Atlantic Council Trump Tariff Tracker"  # [S]
    scenario_access_date: "May 2026"  # [S]
    scenario_date: "February 2026"  # [S]
    filter_rule: "beta_hat_k > 0 AND significant"  # [S]
    # [UNSPECIFIED IN MANUSCRIPT] see sample_construction
    filter_significance_threshold: 0.05
    excluded_industries: "sigma_k = 2"  # [S]

