    interface_to_econometric_chain: "NONE"  # [I]
  NA2_ces_benchmark_network:
    node_set: "{foreign exporters with M > 0} union {DOM}"  # [I]
    domestic_tariff: 0.0  # [I]
    edge_attributes: ["alpha_i", "(1+tau_ikt)"]  # [I]
    induced_supplier_supplier_edges: "complete graph, strength governed by sigma_k"  # [I]
    weight_matrix_row_stochastic: true  # [I]
    weight_matrix_form: "omega_ik = alpha_i (1+tau_ik)^(1-sigma_k) / (1+T_k)^(1-sigma_k)"  # [I]
    weight_matrix_conservation: "sum_i omega_ik = 1"  # [I]
    aggregation_operator: "PowMean_{1-sigma_k} over i with weights alpha"  # [I]
    key_parameter: "sigma_k"  # [S]
    identification_issue: "benchmark component absorbed by delta_kt"  # [I]
  NA3_gravity_network:
    node_set: "countries as exporters and importers"  # [I]
    edges: "directed, one per ordered pair"  # [I]
    edge_weight: "M_ikt"  # [I]
    node_potentials: "multilateral resistance terms"  # [S]
    implemented_truncation: "single importer"  # [I]
    estimator: "PPML"  # [S]
    removed_by_truncation:  # [I]
      - "importer-time FE"
