# ============================================================================#
#
#  From Tariff Changes to Trade Effects: A Practical Framework for Empirical
#  Trade Policy Analysis -- Study Configuration (config.yaml)
#
#  This file is the complete study configuration, STUDY_CONFIG, consumed by
#  the end-to-end orchestrator run_task_25 and by every task-level callable
#  of the Python reproduction of "From Tariff Changes to Trade Effects: A
#  Practical Framework for Empirical Trade Policy Analysis" by Maria
#  Cipollina and Luca De Benedictis (2026). It is a value-for-value
#  transcription of the revised and complete input specification
#  (study_revised_inputs_20261109_222236.md), which the notebook declares as
#  the single source of truth: every section, key and value is present, and
#  every provenance tag of the specification is carried as a comment. Loaded
#  with yaml.safe_load, it reproduces STUDY_CONFIG exactly, with Python tuples
#  read back as lists (run_task_25 accepts either).
#
#  Configuration Sections:
#  • 0  meta and scope                  • 9  algorithm parameters (P1-P5)
#  • 1  interpretive boundaries         • 10 network architecture parameters
#  • 2  raw input schemas (8 frames)    • 11 estimation settings (PPML, HD FE)
#  • 3  preprocessing                   • 12 aggregation and reporting
#  • 4  sample construction             • 13 automated instrumentation
#  • 5  tariff construction             • 14 plot and figure parameters
#  • 6  node augmentation (V_k, DOM)    • 15 replicator's imputation register
#  • 7  scenario construction (Feb 2026)• 16 integrity, audit and tests T1-T16
#  • 8  equation parameters (Eqs 1-19)  • 17 verification targets
#
#  Technical Implementation Features:
#  • Provenance tags: [S] = stated; [I] = implied; [G] = gap;
#    [X] = replicator-imposed. "[UNSPECIFIED IN MANUSCRIPT]" marks a value
#    chosen by a declared rule; the rule is recorded so that the reproduction
#    is auditable.
#  • All strings are double-quoted; the three LLM prompt templates are YAML
#    literal blocks (|-), preserved character for character.
#  • Exponent floats carry a decimal point (for example 1.0e-08) so that
#    YAML 1.1 parsers, including PyYAML, read them as floats, not strings.
#  • Fractions in the specification (1/18, 2/18, 5/18) are stored as their
#    float64 values (0.0555..., 0.111..., 0.277...).
#  • null stands for Python None (a declared gap or an absent design term).
#  • Load:  import yaml
#           with open("config.yaml", encoding="utf-8") as f:
#               STUDY_CONFIG = yaml.safe_load(f)
#
#  Paper Reference:
#  Cipollina, M., & De Benedictis, L. (2026). From Tariff Changes to Trade
#  Effects: A Practical Framework for Empirical Trade Policy Analysis.
#  Prepared for the 15th AIEAA Annual Conference (Rome, Universitas
#  Mercatorum). Submitted 26 October 2026. arXiv preprint arXiv:2610.36171.
#  https://arxiv.org/abs/2610.36171
#
#  Author: CS Chirinda
#  License: MIT
#  Version: 1.0.0
#
# ============================================================================#
#
# ==============================================================================
# STUDY CONFIGURATION: Cipollina & De Benedictis (2026)
# "From Tariff Changes to Trade Effects: A Practical Framework for Empirical
#  Trade Policy Analysis"
# Revised and Complete Input Specification.
#
# Provenance: [S] = stated; [I] = implied; [G] = gap; [X] = replicator-imposed.
# Every value marked "[UNSPECIFIED IN MANUSCRIPT]" is a placeholder chosen by a
# declared rule; the rule is recorded so that the reproduction is auditable.
# ==============================================================================

# --------------------------------------------------------------------------
# 0. META AND SCOPE
# --------------------------------------------------------------------------
meta:
  study_id: "CIPOLLINA_DEBENEDICTIS_2026"  # [S]
  short_title: "From Tariff Changes to Trade Effects"  # [S]
  authors: ["Cipollina, M.", "De Benedictis, L."]  # [S]
  venue: "15th AIEAA Annual Conference, Rome, Universitas Mercatorum"  # [S]
  two_disjoint_chains: ["Chain A: bibliometric (S1.1, Figure 1)", "Chain B: econometric (S2-S4, Tables 1-3)"]  # [S]
  chain_interface: "NONE"  # [I]
  code_availability: "coding table and R-code available upon request"  # [S]
  datasets_cited_in_references: 0  # [S]
  companion_paper_identifier: "Working Paper 8283474, arXiv (identifier format SSRN-shaped)"  # [S]

# --------------------------------------------------------------------------
# 1. INTERPRETIVE BOUNDARIES (the four prohibitions)
# --------------------------------------------------------------------------
interpretive_boundaries:
  equilibrium_scope: "partial equilibrium"  # [S]
  results_are_not_welfare: true  # [S]
  results_are_not_ge: true  # [S]
  results_are_not_output_employment: true  # [S]
  what_results_are: "model-based reallocations of trade flows"  # [S]
  conditional_on: ["estimated trade responses", "maintained assumptions about other determinants"]  # [S]
  broader_evaluation_requires: ["expenditures", "prices", "production", "multilateral resistance"]  # [S]
  exercise_purpose: "illustrate mechanics, not rank winners and losers"  # [S]
  asymmetry_claim: "protectionism is not liberalization reversed"  # [S]
  conservation_note: "the paper's Table 2 sums to roughly -155.8 bn USD, which is incompatible with a closed exercise; a conserving reproduction must report the residual against excluded cells as a finding"  # [X]
  fixed_point_stationarity_finding: "under eq. (14), d(beta_hat_k)/d(sigma_k) = 0 and every sigma_k is a fixed point; the iteration of eq. (U2) is stationary at its initial condition. This is the deepest analytical finding a reproduction must surface"  # [I]

# --------------------------------------------------------------------------
# 2. RAW INPUT SCHEMAS (authoritative column names; must match DataFrames)
# --------------------------------------------------------------------------
raw_input_schemas:
  df_itpde_bilateral:
