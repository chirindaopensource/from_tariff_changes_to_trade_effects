      valid_from: "datetime64[ns]"  # [G]
      valid_to: "datetime64[ns]"  # [G]
  df_tariff_tracker:
    columns:
      row_id: "int16"  # [I]
      country: "string"  # [S]
      iso3: "string"  # [G]
      measure: "string"  # [X]
      legal_basis: "string"  # [G]
      goods_scope: "string"  # [S]
      hs_codes: "list[string]|None"  # [G]
      rate_increment: "float64"  # [S]
      rate_basis: "string{additional,total,minimum}"  # [G]
      effective_date: "datetime64[ns]"  # [S]
      expiry_date: "datetime64[ns]|None"  # [G]
      country_specific: "bool"  # [S]
      selected_partner_set_flag: "int8"  # [X]
  df_study_corpus:
    columns:
      study_id: "string[3]"  # [I]
      authors: "string"  # [S]
      year: "Int16(nullable)"  # [S]
      title: "string(nullable)"  # [S]
      venue: "string(nullable)"  # [S]
      abstract_txt: "string(nullable)"  # [S]
      access_date: "datetime64[ns]"  # [G]
      identifier: "string"  # [G]
      merged_into: "string|None"  # [S]
      resolution_note: "string"  # [X]
  df_affiliation_matrix:
    columns:
      study_id: "string[3]"  # [I]
