      - "outward MR"
      - "third-country market clearing"
      - "expenditure/output/price adjustment"
  NA4_preference_network:
    asserted_structure: "graph on country pairs with a preferential schedule per edge"  # [S]
    constructed: false  # [I]
    element_code: "E9"  # [S]
  NA5_production_network:
    asserted_structure: "directed input-output linkages across sectors and countries"  # [S]
    constructed: false  # [I]
    element_code: "E6"  # [S]
    consequence: "downstream incidence of sectoral tariffs outside the model"  # [I]

# --------------------------------------------------------------------------
# 11. ESTIMATION SETTINGS (PPML / high-dimensional fixed effects)
# --------------------------------------------------------------------------
estimation_settings:
  loss_objective: "PPML pseudo-likelihood (Poisson deviance)"  # [I]
  optimizer: "IRLS / Newton-type"  # [X]
  # [UNSPECIFIED IN MANUSCRIPT] standard HD-FE PPML implementation; alternative = within
  # transformation for balanced panels
  fe_absorption_method: "alternating projections for two-way HD FE"
  # [UNSPECIFIED IN MANUSCRIPT] standard numerical tolerance; necessary to reproduce 2-decimal
  # sigma and 3-decimal margins
  convergence_tolerance: 1.0e-08
  # [UNSPECIFIED IN MANUSCRIPT] cap; separation detector on cells with zero fitted value and
  # positive observed value fires before cap on large panels
  max_iterations: 1000
  separation_rule: "detect and report; drop separating cells"  # [UNSPECIFIED IN MANUSCRIPT]
  # [UNSPECIFIED IN MANUSCRIPT] PPML deviance weighting is implicit; alternative = weight by
  # import share
  weights: "unweighted"
  # [UNSPECIFIED IN MANUSCRIPT] two-way clustering; alternatives single-dimension carried
  clustering_dimension: ["exporter", "product_time"]
  small_cluster_correction: "applied"  # [X]
  bootstrap_replications: null  # [G]
  parameter_estimates_reported_in_paper: 0  # [S] beta_hat never printed

