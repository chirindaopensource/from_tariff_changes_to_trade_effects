    # [S] note to Table 3; inconsistent with eq. (17)'s observed M^0
    denominator: "baseline_predicted_trade"
    selection_rule: "baseline predicted trade"  # [S]
    n_exporters: 15  # [S]
    positive_exporters: ["China +17.0", "India +25.6", "Vietnam +1.4"]  # [S]
    large_negative: ["Japan -37.2", "Germany -29.5", "Mexico -26.8", "UK -26.5", "South Korea -24.6"]  # [S]
    published_values_reference:
      Canada: [119252, 1692, -22620, -17.5]
      Mexico: [83738, 5630, -28070, -26.8]
      China: [61888, 16851, -6316, 17.0]
      Japan: [41257, 698, -16029, -37.2]
      Germany: [28777, 704, -9203, -29.5]
      "South Korea": [16344, 939, -4962, -24.6]
      "United Kingdom": [14583, 377, -4234, -26.5]
      "Saudi Arabia": [14383, 30, -1474, -10.0]
      France: [13046, 251, -2145, -14.5]
      Vietnam: [12727, 604, -427, 1.4]
      Italy: [12652, 735, -3238, -19.8]
