      partner_iso3: "string[3]"  # [I]
      product_code: "string"  # [I]
      nomen_code: "string"  # [G]
      year: "int16"  # [S]
      flow_value: "float64"  # [I]
      flow_flag: "string[1]"  # [I]
      reporter_notes: "string"  # [I]
      value_units_declared: "string"  # [X]
  df_itpde_domestic:
    columns:
      report_iso3: "string[3]"  # [S]
      counterparty: "string"  # [G]
      product_code: "string"  # [I]
      nomen_code: "string"  # [G]
      year: "int16"  # [S]
      flow_value: "float64"  # [I]
      construction_method: "string"  # [G]
  df_wits_trains:
    columns:
      reporter_iso3: "string[3]"  # [S]
      partner_iso3: "string[3]|group_code"  # [I]
      product_code: "string"  # [I]
      nomen_code: "string"  # [G]
      year: "int16"  # [I]
      tariff_type: "category{MFN,PREF,APPLIED}"  # [S]
      duty_form: "category{AD_VALOREM,SPECIFIC,COMPOUND,PROHIBITIVE}"  # [G]
      rate_value: "float64"  # [I]
      rate_unit: "string"  # [I]
      ave_source: "string"  # [G]
      pref_scheme: "string"  # [I]
      quota_flag: "bool"  # [I]
